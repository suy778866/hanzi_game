name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build with Buildozer
        # 核心修复：通过管道自动输入 y，并加上环境变量直接跳过 root 检查
        run: echo "y" | buildozer android debug
        env:
          BUILDOZER_ALLOW_ROOT: 1
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanzi-game-apk
          path: bin/*.apk
